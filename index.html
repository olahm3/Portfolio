<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Online Portfolio</title>

  <style>
    img {
      display: block;
      width: 90%;
      max-width: 800px;
      height: auto;
      margin: 20px auto;
    }
    .chart-container {
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">I'm Olivia and here is my class demo.</p>

  <img
    src="https://unsplash.com/photos/ivfp_yxZuYQ/download?force=true&w=1200"
    alt="Grocery store aisle with stocked shelves">

  <img
    src="https://unsplash.com/photos/VbdUnqoe5UU/download?force=true&w=1200"
    alt="Money">

  <!-- Chart 1 -->
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>

  <!-- Chart 2 -->
  <div class="chart-container">
    <canvas id="chart2"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    // Chart 1
    const ctx = document.getElementById("chart");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: ["Week 1", "Week 2", "Week 3", "Week 4"],
        datasets: [{
          label: "Grocery Store Spending Fall 26",
          data: [30.00, 50.00, 45.00, 20.00],
          borderColor: "black",
          backgroundColor: "white",
          borderWidth: 3,
          fill: true,
          tension: 0.35,
          pointRadius: 4,
          pointBackgroundColor: "#FF0145"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: true }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    // Chart 2
    const ctx2 = document.getElementById("chart2");
    new Chart(ctx2, {
      type: "line",
      data: {
        labels: ["Week 1", "Week 2", "Week 3", "Week 4"],
        datasets: [{
          label: "Grocery Store Spending Fall 26",
          data: [30.00, 50.00, 45.00, 20.00],
          borderColor: "black",
          backgroundColor: "white",
          borderWidth: 3,
          fill: true,
          tension: 0.35,
          pointRadius: 4,
          pointBackgroundColor: "#FF0145"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: true }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  </script>
</body>
</html>
