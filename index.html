<!DOCTYPE html!>
<head>
  <title>My Online Portfolio</title> 
  <meta charset = "UTF-8"> 
  <meta name= "viewport" content ="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width: 90%;
      max-width: 800px;
      height:400px;
        margin: 30px auto;
    }
</style>
  </head>  
<body> 
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;"> I'm Olivia and here is my class demo. </p>
<div style="text-align:center;" class="image">
  <img src ="https://kommodo.ai/i/iUKvZLPz0K07Hn9IUVw8">
</div>  
    <div class= "chart-container">
    <canvas id=chart></canvas>
    </div>
  <div class="chart-container">
  <canvas id="barChart"></canvas>
</div>
    <script>
    const ctx=document.getElementById("chart");
      
    new Chart(ctx,{
              type: "line",
              data: {
              labels: ["Week 1", "Week 2", "Week 3", "Week 4"],
              datasets:[{
      label: "Grocery Store Spending Fall 26",
        data:[30.00, 50.00, 45.00, 20.00],
        borderColor: "black",
    backgroundColor: "white",
    borderWidth:3,
    fill: true,
    tension: 0.35,
    pointRadius: 4,
    pointBackgroundColor: "#FF0145",
    }]
    },
    options:{
      responsive: true,
        maintainAspectRatio:false,
    plugins:{
      legend:{
        display:true
      }
    }, 
    scales: {
      y: {
        beginAtZero: true,
        title: {
        display: true,
          text: "Amount Spent ($)"
      }
      },
        x: {
          title:{
            display: true,
            text: "Week"
          }
        }
    }
    }
    });

const barCtx = document.getElementById("barChart");
      new Chart(barCtx, {
          <div style="text-align:center;" class="image">
  <img src ="https://kommodo.ai/i/BePzqrL2fAc5i1F0N0yl">
</div>  
  type: "bar",
  data: {
    labels: ["Week 1", "Week 2", "Week 3", "Week 4"],
    datasets: [{
      label: "Grocery Store Spending Fall 26",
      data: [30, 50, 45, 20],
      backgroundColor: "#FF0145"
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      y: {
        beginAtZero: true,
      }
    }
  }
});
    
    }
    }
    });
    
</script>
</body>
</html>
